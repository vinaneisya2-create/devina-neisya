<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Kegiatan</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <h1>Formulir Registrasi Acara Kegiatan</h1>
    <form action="" method="post" enctype="multipart/form-data">
        
        <!-- TABEL 1: Data Pendaftar (Teks sudah diparafrase) -->
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width: 100%;">
            <tr>
                <td style="width:32%;">
                    <label for="namalengkap"><strong>Nama Lengkap Peserta</strong></label>
                </td>
                <td>
                    <input type="text" id="namalengkap" name="namalengkap" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="nim"><strong>Nomor Induk Mahasiswa (NIM)</strong></label>
                </td>
                <td>
                    <input type="text" id="nim" name="nim" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="prodi"><strong>Program Studi Pilihan</strong></label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <strong>Identitas Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="lakilaki" name="jeniskelamin" value="Laki-laki" />
                    <label for="lakilaki">Laki-laki</label>
                    <input type="radio" id="perempuan" name="jeniskelamin" value="Perempuan" />
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>
        </table>

        <!-- TABEL 2: Pilihan Kegiatan (Teks sudah diparafrase) -->
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width: 100%;">
            <tr>
                <td style="width:32%;">
                    <strong>Kategori Jenis Kegiatan</strong>
                </td>
                <td>
                    <input type="radio" id="seminar" name="jeniskegiatan" value="Seminar" />
                    <label for="seminar">Seminar</label>
                    <input type="radio" id="pelatihan" name="jeniskegiatan" value="Pelatihan" />
                    <label for="pelatihan">Pelatihan</label>
                    <input type="radio" id="diskusi" name="jeniskegiatan" value="Diskusi" />
                    <label for="diskusi">Diskusi</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <strong>Pilihan Bidang Minat</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="teknologi" name="bidangminat" value="Teknologi" />
                        <label for="teknologi">Teknologi</label>
                    </p>
                    <p>
                        <input type="checkbox" id="organisasi" name="bidangminat" value="Organisasi" />
                        <label for="organisasi">Organisasi</label>
                    </p>
                    <p>
                        <input type="checkbox" id="karier" name="bidangminat" value="Karier" />
                        <label for="karier">Karier</label>
                    </p>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="waktu"><strong>Sesi Waktu Kegiatan</strong></label>
                </td>
                <td>
                    <select id="waktu" name="waktu">
                        <option>Pagi</option>
                        <option>Siang</option>
                        <option>Sore</option>
                    </select>
                </td>
            </tr>
        </table>

        <!-- TABEL 3: Kelengkapan Pendaftaran (Teks sudah diparafrase) -->
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width: 100%;">
            <tr>
                <td style="width:32%;" class="align-top">
                    <label for="harapan"><strong>Tujuan &amp; Harapan Mengikuti Kegiatan</strong></label>
                </td>
                <td>
                    <textarea id="harapan" name="harapan" rows="6" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="buktipembayaran"><strong>Unggah Berkas Bukti Pembayaran</strong></label>
                </td>
                <td>
                    <input type="file" id="buktipembayaran" name="buktipembayaran" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="kirim" value="Kirim Pendaftaran" />
                </td>
            </tr>
        </table>

    </form>
</body>
</html>
